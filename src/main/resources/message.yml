# HEX Color: &#RRGGBB or <#RRGGBB>
# Placeholder: {prefix}, {player}, {target}, {streak}, {days}, {count}, <smallcaps>
prefix: "&#FF6B6B&l[&#FFD93D&lHypeUp&#FF6B6B&l]&r"

general:
  reload-success: "{prefix} &#00FF00<smallcaps>Configuration reloaded successfully!</smallcaps>"
  no-permission: "{prefix} &#FF0000<smallcaps>You don't have permission to use this command!</smallcaps>"
  player-not-found: "{prefix} &#FF0000<smallcaps>Player {player} not found!</smallcaps>"
  database-error: "{prefix} &#FF0000<smallcaps>Database error occurred!</smallcaps>"
  only-player: "{prefix} &#FF0000<smallcaps>This command can only be used by players!</smallcaps>"
fire:
  started: "{prefix} &#FFD93D<smallcaps>You started a fire streak with &#FF6B6B{target}&#FFD93D!</smallcaps>"
  partner-started: "{prefix} &#FF6B6B<smallcaps>{player} &#FFD93Dstarted a fire streak with you!</smallcaps>"
  success: "{prefix} &#00FF00<smallcaps>Successfully lit fire with &#FFD93D{target}&#00FF00!</smallcaps>"
  partner-success: "{prefix} &#00FF00<smallcaps>You lit fire with &#FFD93D{player}&#00FF00!</smallcaps>"
  expired: "{prefix} &#FF0000<smallcaps>Fire with {target} expired! You haven't lit it for {days} days</smallcaps>"
  partner-expired: "{prefix} &#FF0000<smallcaps>Fire with {player} expired!</smallcaps>"
  restored: "{prefix} &#00FF00<smallcaps>Successfully restored fire with {target}! ({count}/{max})</smallcaps>"
  partner-restored: "{prefix} &#00FF00<smallcaps>{player} restored fire with you!</smallcaps>"
  restore-failed: "{prefix} &#FF0000<smallcaps>Cannot restore fire! (Used all {max} restores or exceeded {days} days)</smallcaps>"
  same-ip-blocked: "{prefix} &#FF0000<smallcaps>Cannot create fire streak with players on the same IP address!</smallcaps>"
  ignited: |
    &#FF6B6B&l━━━━━━━━━━━━━━━━━━━━
    &#FFD93D&l<smallcaps>Fire lit with {target}!</smallcaps>
    &#00FF00<smallcaps>Streak: &#FFD93D{streak} &#00FF00days</smallcaps>
    &#FF6B6B&l━━━━━━━━━━━━━━━━━━━━
  partner-ignited: |
    &#FF6B6B&l━━━━━━━━━━━━━━━━━━━━
    &#FFD93D&l<smallcaps>Fire lit with {player}!</smallcaps>
    &#00FF00<smallcaps>Streak: &#FFD93D{streak} &#00FF00days</smallcaps>
    &#FF6B6B&l━━━━━━━━━━━━━━━━━━━━
  limit-reached: "{prefix} &#FF0000<smallcaps>You already have {max} fire partners!</smallcaps>"

status:
  online: "&#00FF00<smallcaps>Online</smallcaps>"
  offline: "&#FF0000<smallcaps>Offline</smallcaps>"
  completed: "&#00FF00<smallcaps>Completed</smallcaps>"
  incomplete: "&#FF0000<smallcaps>Incomplete</smallcaps>"

missions:
  chat:
    progress: "{prefix} &#FFD93D<smallcaps>Chat Progress: &#FF6B6B{current}/{required}</smallcaps>"
    completed: "{prefix} &#00FF00<smallcaps>Chat mission completed!</smallcaps>"
    spam-detected: "{prefix} &#FF0000<smallcaps>Please wait before sending another message!</smallcaps>"
    too-far: "{prefix} &#FF0000<smallcaps>{target} is too far away! Must be within distance</smallcaps>"
    message-received: "{prefix} &#FFD93D<smallcaps>{player}: &#FF6B6B{message}</smallcaps>"
  
  shift:
    progress: "{prefix} &#FFD93D<smallcaps>Shift Progress: &#FF6B6B{current}/{required}</smallcaps>"
    completed: "{prefix} &#00FF00<smallcaps>Shift mission completed!</smallcaps>"
    too-far: "{prefix} &#FF0000<smallcaps>You're too far away! Must be within {distance} blocks</smallcaps>"
  
  gift:
    sent: "{prefix} &#00FF00<smallcaps>Sent items to {target}!</smallcaps>"
    received: "{prefix} &#FFD93D<smallcaps>You received items from {player}!</smallcaps>"
    completed: "{prefix} &#00FF00<smallcaps>Gift mission completed!</smallcaps>"
    too-many-items: "{prefix} &#FF0000<smallcaps>Too many items! Maximum 2304 items allowed.</smallcaps>"
    inventory-full: "{prefix} &#FFD93D<smallcaps>Some items were dropped because inventory is full.</smallcaps>"
    too-far: "{prefix} &#FF0000<smallcaps>{target} is too far away! Must be within {distance} blocks</smallcaps>"

rewards:
  received: |
    &#FFD93D&l━━━━━ <smallcaps>Reward</smallcaps> ━━━━━
    &#00FF00<smallcaps>You maintained a {streak}-day streak!</smallcaps>
    &#FFD93D<smallcaps>Special reward received!</smallcaps>
    &#FFD93D&l━━━━━━━━━━━━━━━━━━━

last-fire-time:
  days: "{days} days ago"
  hours: "{hours} hours ago"
  today: "Today"
  never: "Never"

commands:
  help: |
    &#FF6B6B&l━━━━ Commands ━━━━
    &#FFD93D/hypeup &#FF6B6B- Open main GUI
    &#FFD93D/hypeup send <player> &#FF6B6B- Send items
    &#FFD93D/hypeup msg <player> <message> &#FF6B6B- Send message for chat mission
    &#FFD93D/hypeup info [player] &#FF6B6B- View fire info
    &#FFD93D/hypeup list &#FF6B6B- View fire partners
    &#FFD93D/hypeup reload &#FF6B6B- Reload config
    &#FF6B6B&l━━━━━━━━━━━━━━━━
  
  usage: "{prefix} &#FF0000<smallcaps>Usage</smallcaps>: {usage}"

admin:
  help: |
    &#FF6B6B&lAdmin Commands:
    &#FFD93D/hu admin set <player1> <player2> <amount>
    &#FFD93D/hu admin give <player1> <player2> <amount>
    &#FFD93D/hu admin take <player1> <player2> <amount>
    &#FFD93D/hu admin expired <player1> <player2>
    &#FFD93D/hu admin extinguishfire <player1> <player2>
    &#FFD93D/hu admin resetmission <player1> <player2>
  players-not-found: "{prefix} &#FF0000<smallcaps>One or both players not found!</smallcaps>"
  amount-invalid: "{prefix} &#FF0000<smallcaps>Amount must be a number!</smallcaps>"
  no-streak: "{prefix} &#FF0000<smallcaps>No fire streak found between these players!</smallcaps>"
  unknown-command: "{prefix} &#FF0000<smallcaps>Unknown admin command!</smallcaps>"
  set:
    usage: "{prefix} &#FF0000<smallcaps>Usage</smallcaps>: /hu admin set <player1> <player2> <amount>"
    success: "{prefix} &#00FF00<smallcaps>Set fire streak between {player1} and {player2} to {amount}</smallcaps>"
  give:
    usage: "{prefix} &#FF0000<smallcaps>Usage</smallcaps>: /hu admin give <player1> <player2> <amount>"
    success: "{prefix} &#00FF00<smallcaps>Added {amount} days to fire streak between {player1} and {player2}</smallcaps>"
  take:
    usage: "{prefix} &#FF0000<smallcaps>Usage</smallcaps>: /hu admin take <player1> <player2> <amount>"
    success: "{prefix} &#00FF00<smallcaps>Removed {amount} days from fire streak between {player1} and {player2}</smallcaps>"
  expired:
    usage: "{prefix} &#FF0000<smallcaps>Usage</smallcaps>: /hu admin expired <player1> <player2>"
    success: "{prefix} &#00FF00<smallcaps>Set fire streak between {player1} and {player2} as expired</smallcaps>"
  extinguishfire:
    usage: "{prefix} &#FF0000<smallcaps>Usage</smallcaps>: /hu admin extinguishfire <player1> <player2>"
    success: "{prefix} &#00FF00<smallcaps>Extinguished fire between {player1} and {player2} (streak kept: {streak} days)</smallcaps>"
  resetmission:
    usage: "{prefix} &#FF0000<smallcaps>Usage</smallcaps>: /hu admin resetmission <player1> <player2>"
    success: "{prefix} &#00FF00<smallcaps>Reset missions for fire streak between {player1} and {player2}</smallcaps>"