name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.0.1, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update pom.xml version
      run: mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }}

    - name: Build with Maven
      run: mvn clean package

    - name: Create source archive
      run: |
        mkdir -p release
        zip -r release/HypeUp-${{ steps.version.outputs.VERSION }}-src.zip . \
          -x ".git/*" "target/*" "release/*" "*.iml" ".idea/*"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: HypeUp v${{ steps.version.outputs.VERSION }}
        body: |
          ## HypeUp v${{ steps.version.outputs.VERSION }}
          
          ### Installation
          1. Download `HypeUp-${{ steps.version.outputs.VERSION }}.jar`
          2. Place in your server's `plugins/` folder
          3. Restart server
          
          ### Changes
          See [commits](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
        files: |
          target/HypeUp-*.jar
          release/HypeUp-*-src.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
